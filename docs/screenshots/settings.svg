<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-label="dsh-desktop settings">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f4f5"/>
      <stop offset="1" stop-color="#e4e4e7"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#18181b" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1280" height="800" fill="url(#bg)"/>
  <rect x="80" y="56" width="1120" height="688" rx="16" fill="#fafafa" stroke="#e4e4e7" filter="url(#shadow)"/>
  <rect x="80" y="56" width="1120" height="52" rx="16" fill="#f4f4f5"/>
  <rect x="80" y="92" width="1120" height="16" fill="#f4f4f5"/>
  <circle cx="108" cy="82" r="6" fill="#ff5f57"/>
  <circle cx="128" cy="82" r="6" fill="#febc2e"/>
  <circle cx="148" cy="82" r="6" fill="#28c840"/>
  <rect x="180" y="70" width="92" height="28" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
  <text x="226" y="89" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#18181b">Settings</text>
  <rect x="280" y="70" width="168" height="28" rx="8" fill="transparent"/>
  <circle cx="296" cy="84" r="3" fill="#a1a1aa"/>
  <text x="306" y="89" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#71717a">deepseek-harness</text>
  <rect x="80" y="108" width="1120" height="1" fill="#e4e4e7"/>
  <text x="360" y="164" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="24" font-weight="600" fill="#18181b">Settings</text>
  <text x="360" y="188" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#71717a">Manage the local DeepSeek Harness connection and app preferences.</text>
  <rect x="360" y="214" width="560" height="196" rx="14" fill="#ffffff" stroke="#e4e4e7"/>
  <text x="380" y="242" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#18181b">Connection</text>
  <text x="380" y="262" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#71717a">Connected to DeepSeek Harness.</text>
  <text x="380" y="296" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#71717a">Status</text>
  <text x="520" y="296" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#18181b">Connected</text>
  <text x="380" y="322" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#71717a">Address</text>
  <text x="520" y="322" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#18181b">http://127.0.0.1:3080</text>
  <text x="380" y="348" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#71717a">Runtime source</text>
  <text x="520" y="348" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#18181b">Already running locally</text>
  <rect x="620" y="364" width="88" height="28" rx="7" fill="#ffffff" stroke="#d4d4d8"/>
  <text x="664" y="383" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#18181b">Check again</text>
  <rect x="716" y="364" width="88" height="28" rx="7" fill="#ffffff" stroke="#d4d4d8"/>
  <text x="760" y="383" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#18181b">Stop service</text>
  <rect x="360" y="426" width="560" height="164" rx="14" fill="#ffffff" stroke="#e4e4e7"/>
  <text x="380" y="454" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#18181b">Start DeepSeek Harness</text>
  <text x="380" y="476" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#71717a">Pick a package manager already on this machine.</text>
  <rect x="380" y="494" width="520" height="40" rx="10" fill="#fafafa" stroke="#18181b"/>
  <circle cx="400" cy="514" r="6" fill="none" stroke="#18181b" stroke-width="1.5"/>
  <circle cx="400" cy="514" r="3" fill="#18181b"/>
  <text x="416" y="511" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#18181b">pnpm</text>
  <text x="416" y="526" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#71717a">pnpm dlx @deepseek-ai/dsh web --port 3080</text>
  <rect x="800" y="546" width="100" height="28" rx="7" fill="#18181b"/>
  <text x="850" y="565" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#ffffff">Start</text>
  <rect x="360" y="606" width="560" height="92" rx="14" fill="#ffffff" stroke="#e4e4e7"/>
  <text x="380" y="634" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#18181b">General</text>
  <text x="380" y="662" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#18181b">Language</text>
  <rect x="760" y="644" width="136" height="28" rx="7" fill="#ffffff" stroke="#d4d4d8"/>
  <text x="828" y="663" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#18181b">English</text>
</svg>
