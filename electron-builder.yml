appId: cn.johnhong.dsh-desktop
productName: dsh-desktop
copyright: Copyright © 2026 johnhom
npmRebuild: false
directories:
  output: release
files:
  - dist/**/*
  - package.json
mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  target:
    - target: dmg
      arch:
        - arm64
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
dmg:
  artifactName: ${productName}-${version}-${arch}.dmg
  title: dsh-desktop ${version}
