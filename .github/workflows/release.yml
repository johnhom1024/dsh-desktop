name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  mac-arm64:
    name: macOS arm64 DMG
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Keep DMG filename/app version in sync with the release tag without
      # committing anything back — the stamp only lives on the runner.
      - name: Stamp package.json version from tag
        env:
          TAG: ${{ github.ref_name }} # e.g. v0.1.1 or v0.2.0-rc.1
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag '$TAG' is not a valid semver"
            exit 1
          fi
          npm pkg set "version=${VERSION}"
          echo "Stamped version: ${VERSION}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.11.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install librsvg
        run: brew install librsvg

      - name: Install dependencies
        env:
          npm_config_electron_mirror: ''
          npm_config_electron_custom_dir: ''
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build unsigned Apple Silicon DMG
        env:
          npm_config_electron_mirror: ''
          npm_config_electron_custom_dir: ''
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm dist:mac

      - name: Upload GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            ## macOS 安装提示

            本应用未做 Apple 代码签名与公证，首次打开会被 Gatekeeper 拦截（提示"已损坏，无法打开"或"无法验证开发者"）。

            安装后请任选其一放行：

            **方式一：终端命令（推荐）**

            ```bash
            sudo xattr -r -d com.apple.quarantine /Applications/dsh-desktop.app
            ```

            **方式二：右键打开**

            在"应用程序"里右键点击 dsh-desktop →「打开」→ 再点「打开」。

            > 每次安装新版本都需要重新执行一次，因为隔离属性是针对每个新下载的文件打的。
          files: |
            release/dsh-desktop-*-arm64.dmg
            release/SHA256SUMS-arm64.txt

  mac-x64:
    name: macOS Intel DMG
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Keep DMG filename/app version in sync with the release tag without
      # committing anything back — the stamp only lives on the runner.
      - name: Stamp package.json version from tag
        env:
          TAG: ${{ github.ref_name }} # e.g. v0.1.1 or v0.2.0-rc.1
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag '$TAG' is not a valid semver"
            exit 1
          fi
          npm pkg set "version=${VERSION}"
          echo "Stamped version: ${VERSION}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.11.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install librsvg
        run: brew install librsvg

      - name: Install dependencies
        env:
          npm_config_electron_mirror: ''
          npm_config_electron_custom_dir: ''
        run: pnpm install --frozen-lockfile

      - name: Build unsigned Intel DMG
        env:
          npm_config_electron_mirror: ''
          npm_config_electron_custom_dir: ''
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm dist:mac:intel

      - name: Upload GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            ## macOS 安装提示

            本应用未做 Apple 代码签名与公证，首次打开会被 Gatekeeper 拦截（提示"已损坏，无法打开"或"无法验证开发者"）。

            安装后请任选其一放行：

            **方式一：终端命令（推荐）**

            ```bash
            sudo xattr -r -d com.apple.quarantine /Applications/dsh-desktop.app
            ```

            **方式二：右键打开**

            在"应用程序"里右键点击 dsh-desktop →「打开」→ 再点「打开」。

            > 每次安装新版本都需要重新执行一次，因为隔离属性是针对每个新下载的文件打的。
          files: |
            release/dsh-desktop-*-x64.dmg
            release/SHA256SUMS-x64.txt

  # Runs once after both builds succeed. Records the released version as a
  # regular commit on main so package.json tracks reality without manual
  # bumps. Safe from loops: pushes made with GITHUB_TOKEN never trigger
  # workflows, and beta/* builds never land here (they are tag-less pushes
  # handled by beta-release.yml, whose tags are created by GITHUB_TOKEN).
  bump-main:
    name: Record released version on main
    needs: [mac-arm64, mac-x64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Commit version bump
        env:
          TAG: ${{ github.ref_name }} # e.g. v0.1.1
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag '$TAG' is not a valid semver"
            exit 1
          fi
          npm pkg set "version=${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          if git diff --cached --quiet; then
            echo "package.json already at ${VERSION}; nothing to commit"
            exit 0
          fi
          git commit -m "chore(release): v${VERSION}"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "Pushed version bump: ${VERSION}"
