name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  mac-arm64:
    name: macOS arm64 DMG
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Keep DMG filename/app version in sync with the release tag without
      # committing anything back — the stamp only lives on the runner.
      - name: Stamp package.json version from tag
        env:
          TAG: ${{ github.ref_name }} # e.g. v0.1.1 or v0.2.0-rc.1
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag '$TAG' is not a valid semver"
            exit 1
          fi
          npm pkg set "version=${VERSION}"
          echo "Stamped version: ${VERSION}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.11.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install librsvg
        run: brew install librsvg

      - name: Install dependencies
        env:
          npm_config_electron_mirror: ''
          npm_config_electron_custom_dir: ''
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build unsigned Apple Silicon DMG
        env:
          npm_config_electron_mirror: ''
          npm_config_electron_custom_dir: ''
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm dist:mac

      - name: Upload GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            release/dsh-desktop-*-arm64.dmg
            release/SHA256SUMS-arm64.txt

  mac-x64:
    name: macOS Intel DMG
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Keep DMG filename/app version in sync with the release tag without
      # committing anything back — the stamp only lives on the runner.
      - name: Stamp package.json version from tag
        env:
          TAG: ${{ github.ref_name }} # e.g. v0.1.1 or v0.2.0-rc.1
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag '$TAG' is not a valid semver"
            exit 1
          fi
          npm pkg set "version=${VERSION}"
          echo "Stamped version: ${VERSION}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.11.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install librsvg
        run: brew install librsvg

      - name: Install dependencies
        env:
          npm_config_electron_mirror: ''
          npm_config_electron_custom_dir: ''
        run: pnpm install --frozen-lockfile

      - name: Build unsigned Intel DMG
        env:
          npm_config_electron_mirror: ''
          npm_config_electron_custom_dir: ''
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm dist:mac:intel

      - name: Upload GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release/dsh-desktop-*-x64.dmg
            release/SHA256SUMS-x64.txt
