name: Beta Release

# Push to a branch named `beta/x.y.z` and this workflow:
#   1. derives the base version from the branch name (beta/0.1.1 -> 0.1.1)
#   2. scans existing v0.1.1-beta.* tags on the remote and picks the next number
#   3. stamps package.json with e.g. 0.1.1-beta.3
#   4. builds an unsigned macOS DMG and publishes it as a GitHub pre-release
# Every push to the same branch therefore yields beta.1 -> beta.2 -> beta.3 ...
on:
  push:
    branches:
      - 'beta/**'

permissions:
  contents: write

concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac-arm64:
    name: macOS arm64 DMG (beta)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve next beta version from branch name
        env:
          BRANCH: ${{ github.ref_name }} # e.g. beta/0.1.1
        run: |
          set -euo pipefail
          case "$BRANCH" in
            beta/*) BASE="${BRANCH#beta/}" ;;
            *) echo "::error::branch must be named beta/x.y.z"; exit 1 ;;
          esac
          if ! echo "$BASE" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::base version '$BASE' is not x.y.z"
            exit 1
          fi
          PREFIX="v${BASE}-beta."
          MAX=0
          while read -r ref; do
            tag="${ref#refs/tags/}"
            tag="${tag%^{}}"
            n="${tag#$PREFIX}"
            if [[ "$n" =~ ^[0-9]+$ ]] && (( n > MAX )); then
              MAX=$n
            fi
          done < <(git ls-remote --tags origin "refs/tags/${PREFIX}*")
          NEXT="${BASE}-beta.$((MAX + 1))"
          npm pkg set "version=${NEXT}"
          echo "VERSION=${NEXT}" >> "$GITHUB_ENV"
          echo "Resolved beta version: ${NEXT} (previous max suffix: ${MAX})"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.11.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install librsvg
        run: brew install librsvg

      - name: Install dependencies
        env:
          npm_config_electron_mirror: ''
          npm_config_electron_custom_dir: ''
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build unsigned Apple Silicon DMG
        env:
          npm_config_electron_mirror: ''
          npm_config_electron_custom_dir: ''
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm dist:mac

      - name: Upload GitHub Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          draft: false
          prerelease: true
          generate_release_notes: true
          files: |
            release/dsh-desktop-*-arm64.dmg
            release/SHA256SUMS-arm64.txt
