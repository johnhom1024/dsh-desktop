name: Beta Release

# Push to a branch named `beta/x.y.z` and this workflow:
#   1. derives the base version from the branch name (beta/0.1.1 -> 0.1.1)
#   2. scans existing v0.1.1-beta.* tags on the remote and picks the next number
#   3. stamps package.json with e.g. 0.1.1-beta.3
#   4. builds an unsigned macOS DMG and publishes it as a GitHub pre-release
# Every push to the same branch therefore yields beta.1 -> beta.2 -> beta.3 ...
on:
  push:
    branches:
      - 'beta/**'

permissions:
  contents: write

concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac-arm64:
    name: macOS arm64 DMG (beta)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve next beta version from branch name
        env:
          BRANCH: ${{ github.ref_name }} # e.g. beta/0.1.1
        run: |
          set -euo pipefail
          case "$BRANCH" in
            beta/*) BASE="${BRANCH#beta/}" ;;
            *) echo "::error::branch must be named beta/x.y.z"; exit 1 ;;
          esac
          if ! echo "$BASE" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::base version '$BASE' is not x.y.z"
            exit 1
          fi
          PREFIX="v${BASE}-beta."
          # ls-remote prints "<sha>\trefs/tags/<name>" — strip everything up to
          # the last path segment before parsing the numeric suffix.
          MAX=$(git ls-remote --tags origin "refs/tags/${PREFIX}*" \
            | sed 's#.*refs/tags/##' \
            | sed 's/\^{}$//' \
            | grep -E "${PREFIX}[0-9]+\$" \
            | sed "s#${PREFIX}##" \
            | sort -n | tail -1)
          MAX=${MAX:-0}
          NEXT="${BASE}-beta.$((MAX + 1))"
          if git ls-remote --exit-code --tags origin "refs/tags/v${NEXT}" >/dev/null 2>&1; then
            echo "::error::tag v${NEXT} already exists — refusing to overwrite its release"
            exit 1
          fi
          npm pkg set "version=${NEXT}"
          echo "VERSION=${NEXT}" >> "$GITHUB_ENV"
          echo "Resolved beta version: ${NEXT} (previous max suffix: ${MAX})"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.11.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install librsvg
        run: brew install librsvg

      - name: Install dependencies
        env:
          npm_config_electron_mirror: ''
          npm_config_electron_custom_dir: ''
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build unsigned Apple Silicon DMG
        env:
          npm_config_electron_mirror: ''
          npm_config_electron_custom_dir: ''
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm dist:mac

      - name: Upload GitHub Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          draft: false
          prerelease: true
          generate_release_notes: true
          body: |
            ## macOS 安装提示

            本应用未做 Apple 代码签名与公证，首次打开会被 Gatekeeper 拦截（提示"已损坏，无法打开"或"无法验证开发者"）。

            安装后请任选其一放行：

            **方式一：终端命令（推荐）**

            ```bash
            sudo xattr -r -d com.apple.quarantine /Applications/dsh-desktop.app
            ```

            **方式二：右键打开**

            在"应用程序"里右键点击 dsh-desktop →「打开」→ 再点「打开」。

            > 每次安装新版本都需要重新执行一次，因为隔离属性是针对每个新下载的文件打的。
          files: |
            release/dsh-desktop-*-arm64.dmg
            release/SHA256SUMS-arm64.txt
