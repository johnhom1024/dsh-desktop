<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>dsh-app</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7f8;
        --card: #ffffff;
        --text: #1f2328;
        --muted: #57606a;
        --line: #d0d7de;
        --accent: #1f6feb;
        --danger: #cf222e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1117;
          --card: #161b22;
          --text: #e6edf3;
          --muted: #8b949e;
          --line: #30363d;
          --accent: #4493f8;
          --danger: #f85149;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        background: var(--bg);
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 24px;
        border-bottom: 1px solid var(--line);
        background: var(--card);
      }
      h1 { margin: 0; font-size: 16px; }
      .actions { display: flex; gap: 8px; }
      button {
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--text);
        border-radius: 8px;
        padding: 8px 14px;
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button:disabled { opacity: 0.55; cursor: default; }
      main { max-width: 720px; margin: 48px auto; padding: 0 24px; }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 24px;
      }
      h2 { margin: 0 0 8px; font-size: 22px; }
      p { margin: 0 0 16px; color: var(--muted); }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        background: var(--bg);
        padding: 0.1em 0.35em;
        border-radius: 4px;
      }
      .options { display: grid; gap: 10px; margin: 16px 0 20px; }
      .option {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px;
      }
      .option strong { display: block; }
      .option span { color: var(--muted); font-size: 13px; }
      .status { min-height: 1.5em; }
      .status.error { color: var(--danger); }
      pre.log {
        margin: 16px 0 0;
        max-height: 220px;
        overflow: auto;
        padding: 12px;
        border-radius: 8px;
        background: var(--bg);
        border: 1px solid var(--line);
        font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: pre-wrap;
        display: none;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>dsh-app</h1>
      <div class="actions">
        <button id="detect" type="button">检测</button>
        <button id="settings" type="button">设置</button>
      </div>
    </header>
    <main>
      <section class="card">
        <h2>当前没有检测到 DeepSeek Harness</h2>
        <p>
          本机 <code id="localHint">127.0.0.1:3080</code> 现在不是官方 Web 页面。
          可在设置里改本机 DSH 端口。选择一个本机已有的包管理器，确认后会执行对应命令安装并启动；端口就绪后自动打开页面。
        </p>
        <div id="options" class="options"></div>
        <button id="install" class="primary" type="button" disabled>确认并启动</button>
        <p id="status" class="status">正在检测本机环境…</p>
        <pre id="log" class="log"></pre>
      </section>
    </main>
    <script>
      const api = window.dshShell
      const optionsEl = document.querySelector('#options')
      const installBtn = document.querySelector('#install')
      const statusEl = document.querySelector('#status')
      const logEl = document.querySelector('#log')
      let selectedId = null
      let busy = false

      function setStatus(text, isError) {
        statusEl.textContent = text
        statusEl.classList.toggle('error', Boolean(isError))
      }

      function appendLog(text) {
        logEl.style.display = 'block'
        logEl.textContent += text
        logEl.scrollTop = logEl.scrollHeight
      }

      if (api.onInstallLog) {
        api.onInstallLog(appendLog)
      }

      function render(state) {
        if (state.detected && state.url) {
          setStatus('已检测到 Web 页面，正在打开…')
          return
        }

        optionsEl.innerHTML = ''
        const port = state.localPort || 3080
        document.querySelector('#localHint').textContent = '127.0.0.1:' + port
        selectedId = state.managers.some((item) => item.id === selectedId)
          ? selectedId
          : state.lastPackageManager && state.managers.some((item) => item.id === state.lastPackageManager)
            ? state.lastPackageManager
            : (state.managers[0] && state.managers[0].id) || null

        if (!state.managers.length) {
          optionsEl.innerHTML = '<p>没有在 PATH 里找到 pnpm、npx、yarn 或 bunx。请先安装其中一个，或到设置里改连远程实例。</p>'
        } else {
          for (const item of state.managers) {
            const label = document.createElement('label')
            label.className = 'option'
            label.innerHTML =
              '<input type="radio" name="manager" />' +
              '<div><strong></strong><span></span></div>'
            const input = label.querySelector('input')
            input.value = item.id
            input.checked = item.id === selectedId
            input.addEventListener('change', () => {
              selectedId = item.id
              installBtn.disabled = busy || !selectedId
            })
            label.querySelector('strong').textContent = item.label
            label.querySelector('span').textContent = item.preview
            optionsEl.appendChild(label)
          }
        }

        installBtn.disabled = busy || !selectedId
        if (state.lastError) {
          setStatus(state.lastError, true)
        } else if (state.managers.length) {
          setStatus('选择一个命令后点确认。不会在你点之前执行任何安装。')
        } else {
          setStatus('未找到可用的包管理器。', true)
        }
      }

      async function run(label, fn) {
        if (busy) return
        busy = true
        installBtn.disabled = true
        document.querySelector('#detect').disabled = true
        setStatus(label)
        try {
          render(await fn())
        } catch (error) {
          setStatus(error && error.message ? error.message : String(error), true)
        } finally {
          busy = false
          document.querySelector('#detect').disabled = false
          installBtn.disabled = !selectedId
        }
      }

      document.querySelector('#detect').addEventListener('click', () => {
        void run('正在重新检测…', () => api.detect())
      })
      document.querySelector('#settings').addEventListener('click', () => {
        void api.openSettings()
      })
      installBtn.addEventListener('click', () => {
        if (!selectedId) return
        void run('正在执行命令并等待端口就绪…', () => api.install(selectedId))
      })

      void run('正在检测本机环境…', () => api.getState())
    </script>
  </body>
</html>
