<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss: http://127.0.0.1:* http://localhost:*"
    />
    <title>dsh-app</title>
    <script>
      (() => {
        try {
          const mode = localStorage.getItem('dsh-theme')
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          const dark = mode === 'dark' || ((mode === 'system' || !mode) && prefersDark)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.dataset.theme = mode === 'light' || mode === 'dark' || mode === 'system' ? mode : 'system'
        } catch {}
      })()
    </script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
